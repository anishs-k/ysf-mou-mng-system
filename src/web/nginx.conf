# Purpose: Serves the built @mou/web static bundle and reverse-proxies /api to
# the api container by its docker-compose service name, so the browser only
# ever talks to one origin - avoiding a second CORS hop in production, the
# same "shares the origin behind nginx" arrangement ARCHITECTURE.md already
# names as the deployment target. try_files falls back to index.html so
# react-router's client-side routes (e.g. /companies/new) don't 404 on a
# hard refresh.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed static assets; index.html itself is not
    # matched by this pattern and is always revalidated.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
