version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mou_mng_system_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mou_mng_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: mou_mng_system_api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mou_mng_system
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: src/wen/Dockerfile
    container_name: mou_mng_system_web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - api

volumes:
  postgres_data:
