services:
  postgres:
    image: postgres:15-alpine
    container_name: mou_mng_system_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mou_mng_system
    ports:
      # Host ports 5432 and 5433 are already taken on this dev machine, so the
      # container is published on 5434. Override with MOU_DB_PORT if needed and
      # keep DATABASE_URL in step (see environment.sh / .env.example).
      - "${MOU_DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mou_mng_system"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # The api and web services are added once their Dockerfiles exist. Until then
  # they cannot build, and `docker-compose up` must not fail on them.

volumes:
  postgres_data:
