databases:
  - name: ysf-mou-db
    databaseName: mou_mng_system
    user: postgres
    plan: free

services:
  # Backend API Web Service (Docker)
  - type: web
    name: ysf-mou-api
    runtime: docker
    dockerfilePath: src/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/auth/me
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ysf-mou-db
          property: connectionString
      - key: PORT
        value: 3001
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: NODE_ENV
        value: production
